<!-- SLIDESHOW PRINCIPAL -->
<div class="container" id="gallery">

  <!-- Main Slides -->
  <div class="mySlides">
    <div class="numbertext">1 / 5</div>
    <img src="Goron-mask-2.png" alt="Goron Mask">
  </div>

  <div class="mySlides">
    <div class="numbertext">2 / 5</div>
    <img src="zora-2.png" alt="Zora Mask">
  </div>

  <div class="mySlides">
    <div class="numbertext">3 / 5</div>
    <img src="Deidy-mask.png" alt="Link Deku">
  </div>

  <div class="mySlides">
    <div class="numbertext">4 / 5</div>
    <img src="deku-mask.png" alt="Deku Mask">
  </div>

  <div class="mySlides">
    <div class="numbertext">5 / 5</div>
    <img src="Majoras-mask-hd.png" alt="Deidy Mask 2">
  </div>

  <!-- Navigation Arrows -->
  <a class="prev" onclick="plusSlides(-1)">❮</a>
  <a class="next" onclick="plusSlides(1)">❯</a>

  <!-- Caption -->
  <div class="caption-container">
    <p id="caption"></p>
  </div>

  <!-- Thumbnail Images -->
  <div class="row">
    <div class="column">
      <img class="demo cursor" src="Goron-mask-2.png" style="width:100%" onclick="currentSlide(1)" alt="Goron Mask">
    </div>
    <div class="column">
      <img class="demo cursor" src="zora-2.png" style="width:100%" onclick="currentSlide(2)" alt="Zora Mask">
    </div>
    <div class="column">
      <img class="demo cursor" src="Deidy-mask.png" style="width:100%" onclick="currentSlide(3)" alt="Deidy Mask">
    </div>
    <div class="column">
      <img class="demo cursor" src="deku-mask.png" style="width:100%" onclick="currentSlide(4)" alt="Deku Mask">
    </div>
    <div class="column">
      <img class="demo cursor" src="Majoras-mask-hd.png" style="width:100%;" onclick="currentSlide(5)" alt="Majora's Mask">
    </div>
  </div>

</div>
